name: Garmin import

on:
  schedule:
    # times are UTC: 06:30, 13:00 and 21:00 Swiss winter time (one hour later in summer)
    - cron: "30 5 * * *"
    - cron: "0 12 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back"
        default: "3"

permissions:
  contents: write   # only for the keep-alive commit below

concurrency:
  group: garmin
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Zurich
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # Until the secrets are entered (README step 4b) the import is skipped instead of failing.
      - name: Check secrets
        id: cfg
        env:
          HAS_GARMIN: ${{ secrets.GARMIN_TOKENS != '' || secrets.GARMIN_PASSWORD != '' }}
          HAS_SUPABASE: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_KEY != '' && secrets.SUPABASE_USER_ID != '' }}
        run: |
          if [ "$HAS_GARMIN" = "true" ] && [ "$HAS_SUPABASE" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Garmin import skipped: secrets not set yet (README step 4b)."
          fi

      - uses: actions/setup-python@v6
        if: steps.cfg.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: garmin/requirements.txt

      - run: pip install -r garmin/requirements.txt
        if: steps.cfg.outputs.ok == 'true'

      - name: Fetch Garmin and upload to Supabase
        if: steps.cfg.outputs.ok == 'true'
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
          GARMIN_DAYS: ${{ github.event.inputs.days || '3' }}
        run: python garmin/sync.py

      # GitHub pauses scheduled workflows after 60 days without a commit.
      # This adds an empty commit every 50 days so the import keeps running.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep Garmin schedule alive"
            git push
          fi
