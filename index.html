<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life dashboard</title>
<meta name="description" content="Personal training, routine and life dashboard">
<meta name="theme-color" content="#f4f5fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0c1f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Life">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app"><main id="view"></main></div>
<nav id="tabs"></nav>
<div id="toast" class="toast" role="status"></div>
<div id="modalroot"></div>
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/app.js"></script>
<script src="js/sync.js"></script>
<script src="js/garmin.js"></script>
<script src="js/push.js"></script>
<script>
// Offline support. Skipped on localhost while developing (add ?sw=1 to test it locally).
const devHost=/^(localhost|127\.0\.0\.1)$/.test(location.hostname)&&!/[?&]sw=1/.test(location.search);
if('serviceWorker' in navigator&&location.protocol!=='file:'&&!devHost){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      const ask=w=>{if(window.LD)window.LD.updateReady(()=>w.postMessage('skip'));};
      if(reg.waiting&&navigator.serviceWorker.controller)ask(reg.waiting);
      reg.addEventListener('updatefound',()=>{
        const w=reg.installing;if(!w)return;
        w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)ask(w);});
      });
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{});});
    }).catch(()=>{});
    let reloading=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloading)return;reloading=true;location.reload();});
  });
}
</script>
</body>
</html>
